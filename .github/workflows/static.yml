<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>الصفحة غير متاحة</title>
  <style>
    body {
      margin: 0;
      background-color: #d9d9d9;
      overflow: hidden;
      height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .language-buttons {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
    }

    .language-buttons button {
      background-color: #004369;
      color: white;
      border: none;
      padding: 10px 15px;
      margin-right: 5px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
    }

    .language-buttons button:hover {
      background-color: #006080;
    }

    .fancy-text {
      padding: 40px 60px;
      background-color: #004369;
      color: #d9d9d9;
      font-size: 28px;
      border-radius: 100px;
      border: 4px solid #004369;
      box-shadow: 0 0 30px #004369;
      text-align: center;
      z-index: 5;
      position: relative;
    }

    .circle {
      position: absolute;
      width: 120px;
      height: 120px;
      background-color: #2c8c99;
      border-radius: 50%;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="language-buttons">
    <button onclick="setLanguage('en')">English</button>
    <button onclick="setLanguage('ar')">Arabic</button>
    <button onclick="setLanguage('ms')">Bahasa Melayu</button>
  </div>

  <div class="fancy-text" id="langText">
    الصفحة غير متاحة حالياً. ترقبوا التحديثات قريباً!
  </div>

  <script>
    const texts = {
      ar: "الصفحة غير متاحة حالياً. ترقبوا التحديثات قريباً!",
      en: "The page is currently unavailable. Stay tuned for updates soon!",
      ms: "Halaman ini tidak tersedia buat masa ini. Nantikan kemas kini tidak lama lagi!"
    };

    function setLanguage(lang) {
      document.getElementById("langText").textContent = texts[lang];
    }

    // ==== دوائر تتحرك حركة بسيطة ====
    const numCircles = 6;
    const speed = 0.2;
    const size = 120;
    const minDistance = 130;
    const circles = [];

    function createCircle() {
      const circle = document.createElement('div');
      circle.classList.add('circle');

      let x, y, valid = false;

      while (!valid) {
        x = Math.random() * (window.innerWidth - size);
        y = Math.random() * (window.innerHeight - size);
        valid = true;
        for (const c of circles) {
          const dx = c.x - x;
          const dy = c.y - y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < minDistance) {
            valid = false;
            break;
          }
        }
      }

      circle.style.left = `${x}px`;
      circle.style.top = `${y}px`;
      document.body.appendChild(circle);

      const dx = (Math.random() * 2 - 1) * speed;
      const dy = (Math.random() * 2 - 1) * speed;

      circles.push({ el: circle, x, y, dx, dy });
    }

    function animateCircles() {
      for (let c of circles) {
        c.x += c.dx;
        c.y += c.dy;

        if (c.x < 0 || c.x > window.innerWidth - size) c.dx *= -1;
        if (c.y < 0 || c.y > window.innerHeight - size) c.dy *= -1;

        c.el.style.left = `${c.x}px`;
        c.el.style.top = `${c.y}px`;
      }
      requestAnimationFrame(animateCircles);
    }

    for (let i = 0; i < numCircles; i++) createCircle();
    animateCircles();
  </script>

</body>
</html>
