<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>الصفحة غير متاحة</title>
  <style>
    body {
      margin: 0;
      background-color: #d9d9d9;
      overflow: hidden;
      height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .language-buttons {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
    }

    .language-buttons button {
      background-color: #004369;
      color: white;
      border: none;
      padding: 10px 15px;
      margin-right: 5px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
    }

    .language-buttons button:hover {
      background-color: #006080;
    }

    .fancy-text {
      padding: 40px 60px;
      background-color: #004369;
      color: #d9d9d9;
      font-size: 28px;
      border-radius: 100px;
      border: 4px solid #004369;
      box-shadow: 0 0 30px #004369;
      text-align: center;
      z-index: 5;
      position: relative;
    }

    .circle {
      position: absolute;
      width: 120px;
      height: 120px;
      background-color: #2c8c99;
      border-radius: 50%;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="language-buttons">
    <button onclick="setLanguage('en')">English</button>
    <button onclick="setLanguage('ar')">Arabic</button>
    <button onclick="setLanguage('ms')">Bahasa Melayu</button>
  </div>

  <div class="fancy-text" id="langText">
    الصفحة غير متاحة حالياً. ترقبوا التحديثات قريباً!
  </div>

</body>
</html>
